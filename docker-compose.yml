services:
  db:
    image: postgres:17-alpine
    container_name: sw-mejor-ninez-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sw_mejor_ninez
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sw_mejor_ninez"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sw-mejor-ninez-backend
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=sw_mejor_ninez
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - API_BACKEND_URL=http://backend:8000
        - NEXT_PUBLIC_API_URL=/api
    container_name: sw-mejor-ninez-frontend
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - API_BACKEND_URL=http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  # Suite de pruebas del backend. No arranca con `docker compose up`:
  # se ejecuta con `docker compose --profile test run --rm backend-tests`.
  # `command` sobreescribe el CMD de la imagen, por lo que NO corre
  # entrypoint.sh (no migra ni siembra la DB de desarrollo).
  backend-tests:
    profiles: ["test"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=sw_mejor_ninez_test
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Bind-mount de la configuracion y de las pruebas: permite editarlas
      # sin reconstruir la imagen. El codigo de `app/` si viene de la imagen,
      # para que la suite valide el artefacto que se despliega.
      - ./backend/tests:/app/tests
      - ./backend/pytest.ini:/app/pytest.ini:ro
    command: pytest

volumes:
  pgdata:
  uploads:
