[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -q --strict-markers
filterwarnings =
    ignore::DeprecationWarning:pydantic._internal._fields
    ignore::DeprecationWarning:jose.jwt
    ignore::DeprecationWarning:passlib
markers =
    characterization: fija comportamiento actual observado, no un contrato deseado
    slow: ciclo de migraciones/seed sobre bases scratch
